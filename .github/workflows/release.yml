# A version tag (1.2.3) builds the plugin here, signs what was built (artifact attestation: anyone can check that
# main.js, manifest.json and styles.css come from this repository at this tag) and publishes the release.
# The release notes are the tag's message: git tag -a 1.2.3 -m "What changed".
name: Release

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the tag with its message
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check that the tag is the version in the manifest
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then echo "The tag $GITHUB_REF_NAME is not the version in manifest.json ($version)"; exit 1; fi
          mkdir release
          cp main.js manifest.json styles.css release/
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/main.js release/manifest.json release/styles.css \
            --title "$GITHUB_REF_NAME" --notes-from-tag --verify-tag
