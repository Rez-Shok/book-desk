# Updates of the build tools and of the actions above, once a month, as pull requests to look over.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      build-tools:
        patterns: ['*']
    # a major version of the lint or build tools is taken by hand: the type-aware lint must support it first
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
