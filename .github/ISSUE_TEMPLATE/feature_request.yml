name: An idea
description: Something the desk could do, or do better.
labels: [idea]
body:
  - type: textarea
    id: need
    attributes:
      label: What you would like to do
      description: Start from what you want to do while reading, not from how it should look.
      placeholder: When I read a long book I lose the pages where I wrote cards…
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How it could work
  - type: textarea
    id: now
    attributes:
      label: How you do it now
